category: vehicle

onboarding_questions:
  - Make and model?
  - Year?
  - What is the registration plate?
  - What fuel type? (petrol, diesel, hybrid, EV)
  - Current odometer reading in kilometres? (approximate)
  - What is the next service due date?
  - What is the next service due at in kilometres? (e.g. 85000 km)
  - When is the registration next due?

checklist:
  - name: Car
    priority: high
    reason: Service and registration reminders are high-value
  - name: Trailer
    priority: medium
    reason: Registration and bearing service
  - name: Bicycle
    priority: low
    reason: Annual chain and brake service

maintenance_schedules:
  default:
    scheduled_service:
      interval_days: 180
      notes: 6-month or 10,000km service
    tyre_rotation:
      interval_days: 180
      notes: Rotate every 10,000km
    registration:
      interval_days: 365
      notes: Annual registration renewal
    tyre_pressure_check:
      interval_days: 30
      notes: Check tyre pressure monthly
