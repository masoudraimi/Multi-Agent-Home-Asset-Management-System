[project]
name = "home-asset-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "bcrypt>=4.1.0",
    "openai>=1.0.0",
    "httpx>=0.28.1",
    "mcp>=1.27.2",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "reflex>=0.6.0",
    "supabase>=2.0.0",
    "psycopg[binary]>=3.3.4",
    # LangGraph agent architecture (Phase 0 groundwork for the AI rewrite)
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langchain-core>=1.5.0",
    "langchain-anthropic>=1.5.0",
    "langchain-openai>=1.4.0",
    # Observability & resilience
    "langsmith>=0.10.0",
    "langfuse>=4.14.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "tenacity>=9.1.0",
    # Semantic memory (numpy is used by core/memory/semantic.py's test-double
    # cosine similarity; pgvector gives psycopg3 a `vector` type adapter)
    "numpy>=1.26",
    "pgvector>=0.3.6",
    "llama-index-core>=0.14.24",
    "deepagents>=0.7.11",
    "pydantic-ai-slim>=2.36.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
