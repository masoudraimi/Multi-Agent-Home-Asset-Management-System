services:
  app:
    build: .
    ports:
      - "3000:3000"       # Reflex frontend (Next.js)
      - "8001:8001"       # Reflex backend (FastAPI + WebSocket)
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # claude_cli won't work in a container — use claude_sdk or openrouter
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      CHECKPOINTER: ${CHECKPOINTER:-sqlite}
    restart: unless-stopped
